<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // Sincroniza a orientação das duas câmeras.
    AFRAME.registerComponent('sync-camera', {
      schema: {
        source: { type: 'selector' }
      },

      tick: function () {
        const cameraOriginal = this.data.source;

        if (!cameraOriginal) return;

        this.el.object3D.quaternion.copy(
          cameraOriginal.object3D.quaternion
        );
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    /* ÁREA PRINCIPAL */
    #stereo-view {
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* CENAS DO A-FRAME */
    #stereo-view a-scene {
      position: relative;
      display: block;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* VISUALIZAÇÃO NORMAL NO COMPUTADOR */
    #scene-esquerda {
      width: 100%;
      flex: 0 0 100%;
    }

    #scene-direita {
      display: none;
    }

    /* MENU SUPERIOR */
    .viewer-tools {
      position: fixed;
      z-index: 100;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .viewer-tools a,
    .viewer-tools span {
      display: block;
      padding: 11px 14px;
      color: white;
      background: rgba(0, 35, 65, 0.90);
      font-size: 14px;
      text-decoration: none;
      border-radius: 5px;
    }

    .viewer-tools a:hover {
      background: #00579d;
    }

    /* INSTRUÇÕES */
    .vr-instructions {
      position: fixed;
      z-index: 100;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      color: white;
      background: rgba(0, 35, 65, 0.88);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
    }

    /* TELA DIVIDIDA PARA ÓCULOS VR */
    @media screen and (max-width: 768px) {

      html, body {
        width: 100%;
        height: 100%;
        height: 100dvh;
      }

      #stereo-view {
        display: flex;
        flex-direction: row;
        width: 100vw;
        height: 100%;
        height: 100dvh;
      }

      #stereo-view #scene-esquerda,
      #stereo-view #scene-direita {
        display: block !important;
        position: relative;
        width: 50vw !important;
        min-width: 50vw !important;
        max-width: 50vw !important;
        height: 100% !important;
        flex: 0 0 50vw !important;
      }

      .viewer-tools {
        top: 8px;
        left: 8px;
        gap: 5px;
      }

      .viewer-tools a,
      .viewer-tools span {
        padding: 7px 9px;
        font-size: 10px;
      }

      .vr-instructions {
        bottom: 8px;
        width: 90%;
        max-width: 90%;
        padding: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <nav class="viewer-tools" aria-label="Controles da visita virtual">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
    <span>Movimente o celular para olhar ao redor</span>
  </nav>

  <!-- INSTRUÇÕES -->
  <div class="vr-instructions">
    Coloque o celular nos óculos VR e explore o laboratório.
  </div>

  <!-- VISUALIZAÇÃO 360° -->
  <div id="stereo-view">

    <!-- OLHO ESQUERDO -->
    <a-scene
      id="scene-esquerda"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      renderer="colorManagement: true"
    >

      <a-assets>
        <img id="panorama-esquerdo" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-esquerdo"
        rotation="0 -90 0">
      </a-sky>

      <a-entity
        id="camera-esquerda"
        camera
        position="0 1.6 0"
        look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
      ></a-entity>

    </a-scene>

    <!-- OLHO DIREITO -->
    <a-scene
      id="scene-direita"
      embedded
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true"
    >

      <a-assets>
        <img id="panorama-direito" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-direito"
        rotation="0 -90 0">
      </a-sky>

      <a-entity
        camera
        position="0 1.6 0"
        sync-camera="source: #camera-esquerda"
      ></a-entity>

    </a-scene>

  </div>

</body>
</html>
