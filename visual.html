
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <!-- Framework A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Componente de sincronização da câmera do olho direito -->
  <script>
    AFRAME.registerComponent('sync-camera', {
      schema: {
        source: { type: 'selector' }
      },
      tick: function () {
        const sourceCamera = this.data.source;
        if (!sourceCamera) return;
        this.el.object3D.quaternion.copy(
          sourceCamera.object3D.quaternion
        );
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Força os blocos a ficarem lado a lado (Split-screen) */
    #stereo-view {
      display: flex;
      flex-direction: row; 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Computador e Telas Grandes: Exibe apenas a cena esquerda de forma cheia */
    #scene-esquerda,
    #scene-direita {
      position: relative;
      margin: 0;
      padding: 0;
      height: 100vh !important;
    }

    #scene-esquerda {
      display: block;
      width: 100vw !important;
      flex: 0 0 100vw;
    }

    #scene-direita {
      display: none !important;
    }

    /* Top controls */
    .viewer-tools {
      position: fixed;
      z-index: 100;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-tools a,
    .viewer-tools span {
      padding: 11px 14px;
      color: #fff;
      background: rgba(0, 35, 65, 0.90);
      font-size: 14px;
      text-decoration: none;
      border-radius: 5px;
    }

    .viewer-tools a:hover {
      background: #00579d;
    }

    /* Instructions */
    .vr-instructions {
      position: fixed;
      z-index: 100;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      color: #fff;
      background: rgba(0, 35, 65, 0.88);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
    }

    /* Dispositivos móveis na horizontal (Landscape): Divide a tela estritamente ao meio */
    @media screen and (max-width: 920px) and (orientation: landscape) {
      html, body {
        width: 100%;
        height: 100dvh;
      }

      #stereo-view {
        display: flex;
        flex-direction: row;
        width: 100vw;
        height: 100dvh;
      }

      #stereo-view #scene-esquerda,
      #stereo-view #scene-direita {
        display: block !important;
        position: relative;
        width: 50vw !important;
        min-width: 50vw !important;
        max-width: 50vw !important;
        height: 100dvh !important;
        flex: 0 0 50vw !important;
      }

      .viewer-tools {
        top: 8px;
        left: 8px;
        gap: 5px;
      }

      .viewer-tools a,
      .viewer-tools span {
        padding: 7px 9px;
        font-size: 10px;
      }

      .vr-instructions {
        bottom: 8px;
        width: 90%;
        max-width: 90%;
        padding: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <nav class="viewer-tools" aria-label="Virtual tour controls">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
    <span>Arraste ou movimente o celular para olhar ao redor</span>
  </nav>

  <div class="vr-instructions">
    Coloque o celular nos óculos VR para explorar o laboratório.
  </div>

  <main id="stereo-view">

    <!-- LEFT EYE -->
    <a-scene
      id="scene-esquerda"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      renderer="colorManagement: true"
    >
      <a-assets>
        <img id="panorama-esquerdo" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-esquerdo"
        rotation="0 -90 0">
      </a-sky>

      
    </a-scene>

    <!-- RIGHT EYE -->
    <a-scene
      id="scene-direita"
      embedded
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true"
    >
      <a-assets>
        <img id="panorama-direito" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-direito"
        rotation="0 -90 0">
      </a-sky>

      
    </a-scene>

  </main>

</body>
</html>
