<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Estrutura base para Computadores */
    #stereo-view {
      display: flex;
      flex-direction: row; 
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #scene-esquerda,
    #scene-direita {
      position: relative;
      margin: 0;
      padding: 0;
      height: 100vh !important;
      overflow: hidden;
    }

    .kuula-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #scene-esquerda {
      display: block;
      width: 100vw !important;
      flex: 0 0 100vw;
    }

    #scene-direita {
      display: none !important;
    }

    /* Controles superiores padrão */
    .viewer-tools {
      position: fixed;
      z-index: 100;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-tools a,
    .viewer-tools button {
      padding: 11px 14px;
      border: 0;
      color: #fff;
      background: rgba(0, 35, 65, 0.90);
      font-size: 14px;
      text-decoration: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .viewer-tools a:hover,
    .viewer-tools button:hover {
      background: #00579d;
    }

    .vr-instructions {
      position: fixed;
      z-index: 100;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      color: #fff;
      background: rgba(0, 35, 65, 0.88);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
    }

    /* Duas metades no celular, inclusive quando estiver em paisagem */
    @media screen and (max-width: 1024px), screen and (hover: none) and (pointer: coarse) {
      html, body {
        width: 100%;
        height: 100dvh;
      }

      #stereo-view {
        display: flex;
        flex-direction: row;
        position: fixed;
        inset: 0;
        width: 100vw !important;
        height: 100dvh !important;
        transform: none;
      }

      #stereo-view #scene-esquerda,
      #stereo-view #scene-direita {
        display: block !important;
        position: relative;
        width: 50% !important;
        height: 100% !important;
        flex: 0 0 50% !important;
      }

      .viewer-tools {
        top: 12px;
        left: 12px;
        gap: 5px;
      }

      .viewer-tools a,
      .viewer-tools button {
        padding: 8px 10px;
        font-size: 11px;
      }

      .vr-instructions {
        bottom: 12px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        padding: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <nav class="viewer-tools" aria-label="Virtual tour controls">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
    <button id="vr-mode" type="button">Ativar modo VR 360º</button>
  </nav>

  <div class="vr-instructions">
    Toque em “Ativar modo VR”; se a tela não girar, vire o celular na horizontal.
  </div>

  <main id="stereo-view">

    <!-- LEFT EYE -->
    <section id="scene-esquerda">
      <iframe
        class="kuula-frame"
        src="https://kuula.co/share/LCHdQ/collection/7dcCJ?logo=1&amp;info=1&amp;fs=1&amp;vr=1&amp;thumbs=1"
        title="Visita virtual 360° do Lab 4.0 - tela esquerda"
        allow="fullscreen; gyroscope; accelerometer; magnetometer; xr-spatial-tracking"
        >
      </iframe>
    </section>

    <!-- RIGHT EYE -->
    <section id="scene-direita">
      <iframe
        class="kuula-frame"
        src="https://kuula.co/share/LCHdQ/collection/7dcCJ?logo=1&amp;info=1&amp;fs=1&amp;vr=1&amp;thumbs=1"
        title="Visita virtual 360° do Lab 4.0 - tela direita"
        allow="fullscreen; gyroscope; accelerometer; magnetometer; xr-spatial-tracking"
        >
      </iframe>
    </section>

  </main>

  <script>
    const vrModeButton = document.getElementById('vr-mode');
    const vrInstructions = document.querySelector('.vr-instructions');

    vrModeButton.addEventListener('click', async () => {
      const landscapeQuery = window.matchMedia('(orientation: landscape)');
      let motionPermissionRequest = Promise.resolve('granted');

      if (typeof DeviceOrientationEvent !== 'undefined'
        && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          motionPermissionRequest = DeviceOrientationEvent.requestPermission();
        } catch {
          motionPermissionRequest = Promise.resolve('denied');
        }
      }

      let fullscreenRequest = Promise.resolve();
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        try {
          fullscreenRequest = document.documentElement.requestFullscreen();
        } catch {
          fullscreenRequest = Promise.resolve();
        }
      }

      let motionPermission = 'denied';
      try {
        motionPermission = await motionPermissionRequest;
      } catch {
        motionPermission = 'denied';
      }

      try {
        await fullscreenRequest;
        if (!landscapeQuery.matches && screen.orientation?.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch {
      }

      const isLandscape = landscapeQuery.matches;
      vrInstructions.textContent = isLandscape
        ? motionPermission === 'granted'
          ? 'Modo horizontal ativo. Coloque o celular nos óculos VR.'
          : 'Permita o acesso aos sensores para usar o movimento no VR.'
        : motionPermission === 'granted'
          ? 'Gire o celular na horizontal e coloque-o nos óculos VR.'
          : 'Permita os sensores e gire o celular na horizontal.';
    });
  </script>

</body>
</html>
