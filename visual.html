

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual interativa de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }

    .viewer-tools {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .viewer-tools a,
    .viewer-tools span {
      padding: 11px 14px;
      color: white;
      background: rgba(0, 35, 65, 0.88);
      font-size: 14px;
      text-decoration: none;
      border-radius: 4px;
    }

    .viewer-tools a:hover {
      background: #00579d;
    }

    .vr-instructions {
      position: fixed;
      z-index: 10;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      color: white;
      background: rgba(0, 35, 65, 0.85);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
      width: max-content;
      max-width: 90%;
    }

    @media (max-width: 600px) {
      .viewer-tools {
        top: 10px;
        left: 10px;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <nav class="viewer-tools" aria-label="Controles da visita virtual">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
    <span>Arraste ou deslize para olhar ao redor</span>
  </nav>

  <div class="vr-instructions" id="vr-instructions">
    Para usar os óculos VR, pressione o botão de realidade virtual.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: true; enterVRButton: true"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true"
  >

    <a-assets>
      <img id="panorama-lab" src="panorama.jpeg" crossorigin="anonymous">
    </a-assets>

    <a-sky
      src="#panorama-lab"
      rotation="0 -90 0">
    </a-sky>

    <a-entity
      camera
      position="0 1.6 0"
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
    ></a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const instructions = document.getElementById('vr-instructions');

    scene.addEventListener('enter-vr', () => {
      instructions.textContent = 'Modo VR ativado! Explore o laboratório movimentando a cabeça.';
    });

    scene.addEventListener('exit-vr', () => {
      instructions.textContent = 'Para usar os óculos VR, pressione o botão de realidade virtual.';
    });
  </script>

</body>
</html>
