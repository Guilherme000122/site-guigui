<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Estrutura base para Computadores */
    #stereo-view {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #scene-panorama {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .kuula-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Controles superiores padrão */
    .viewer-tools {
      position: fixed;
      z-index: 100;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-tools a {
      padding: 11px 14px;
      color: #fff;
      background: rgba(0, 35, 65, 0.90);
      font-size: 14px;
      text-decoration: none;
      border-radius: 5px;
    }

    .viewer-tools a:hover {
      background: #00579d;
    }

    .vr-instructions {
      position: fixed;
      z-index: 100;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: 90%;
      padding: 12px 18px;
      color: #fff;
      background: rgba(0, 35, 65, 0.88);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
    }

    @media screen and (max-width: 1024px), screen and (hover: none) and (pointer: coarse) {
      html, body {
        width: 100%;
        height: 100dvh;
      }

      #stereo-view {
        height: 100dvh;
      }

      .viewer-tools {
        top: 12px;
        left: 12px;
        gap: 5px;
      }

      .viewer-tools a {
        padding: 8px 10px;
        font-size: 11px;
      }

      .vr-instructions {
        top: 55px;
        bottom: auto;
        left: 12px;
        right: 12px;
        transform: none;
        width: auto;
        max-width: none;
        padding: 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

  <nav class="viewer-tools" aria-label="Virtual tour controls">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
  </nav>

  <div class="vr-instructions">
    No celular, toque no botão VR do Kuula para ativar a visão dividida e o movimento da cabeça.
  </div>

  <main id="stereo-view">
    <section id="scene-panorama">
      <iframe
        class="kuula-frame"
        src="https://kuula.co/share/LCHdQ/collection/7dcCJ?logo=1&amp;info=1&amp;fs=1&amp;vr=1&amp;thumbs=1"
        title="Visita virtual 360° do Lab 4.0"
        allow="gyroscope; accelerometer; magnetometer; xr-spatial-tracking"
        allowfullscreen>
      </iframe>
    </section>
  </main>

</body>
</html>
