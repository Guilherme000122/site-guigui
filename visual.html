<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore o Lab 4.0 do SENAI em uma visita virtual de 360 graus.">
  <title>Visita 360° — Lab 4.0 SENAI</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // Mantém as duas imagens com a mesma orientação.
    AFRAME.registerComponent('sync-camera', {
      schema: {
        source: { type: 'selector' }
      },

      tick: function () {
        const source = this.data.source;
        if (!source) return;

        this.el.object3D.quaternion.copy(
          source.object3D.quaternion
        );
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #stereo-view {
      display: flex;
      width: 100%;
      height: 100%;
    }

    a-scene {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
    }

    #scene-direita {
      display: none;
    }

    .viewer-tools {
      position: fixed;
      z-index: 10;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .viewer-tools a,
    .viewer-tools span {
      padding: 11px 14px;
      color: white;
      background: rgba(0, 35, 65, 0.88);
      font-size: 14px;
      text-decoration: none;
      border-radius: 4px;
    }

    .viewer-tools a:hover {
      background: #00579d;
    }

    .vr-instructions {
      position: fixed;
      z-index: 10;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      color: white;
      background: rgba(0, 35, 65, 0.85);
      border-radius: 5px;
      font-size: 13px;
      text-align: center;
      width: max-content;
      max-width: 90%;
    }

    @media (max-width: 768px) {
      #stereo-view {
        display: flex;
        flex-direction: row;
      }

      #scene-esquerda,
      #scene-direita {
        display: block;
        width: 50%;
        height: 100%;
        flex: 0 0 50%;
      }

      .viewer-tools {
        top: 8px;
        left: 8px;
        gap: 5px;
      }

      .viewer-tools a,
      .viewer-tools span {
        padding: 7px;
        font-size: 10px;
      }

      .vr-instructions {
        bottom: 8px;
        font-size: 10px;
        padding: 7px;
      }
    }
  </style>
</head>

<body>

  <nav class="viewer-tools" aria-label="Controles da visita virtual">
    <a href="index.html#visita">← Voltar ao Lab 4.0</a>
    <span>Movimente o celular para explorar</span>
  </nav>

  <div class="vr-instructions">
    Coloque o celular nos óculos VR para explorar o laboratório.
  </div>

  <div id="stereo-view">

    <!-- IMAGEM DO OLHO ESQUERDO -->
    <a-scene
      id="scene-esquerda"
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      renderer="colorManagement: true"
    >
      <a-assets>
        <img id="panorama-esquerdo" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-esquerdo"
        rotation="0 -90 0">
      </a-sky>

      <a-entity
        id="camera-esquerda"
        camera
        position="0 1.6 0"
        look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
      ></a-entity>
    </a-scene>

    <!-- IMAGEM DO OLHO DIREITO -->
    <a-scene
      id="scene-direita"
      embedded
      vr-mode-ui="enabled: false"
      renderer="colorManagement: true"
    >
      <a-assets>
        <img id="panorama-direito" src="panorama.jpeg">
      </a-assets>

      <a-sky
        src="#panorama-direito"
        rotation="0 -90 0">
      </a-sky>

      <a-entity
        camera
        position="0 1.6 0"
        sync-camera="source: #camera-esquerda"
      ></a-entity>
    </a-scene>

  </div>

</body>
</html>
