<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore o Lab 4.0 do SENAI em uma visita virtual interativa de 360 graus."
    />
    <title>Visita 360° — Lab 4.0 SENAI</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      a-scene {
        width: 100%;
        height: 100%;
      }

      .viewer-tools {
        position: fixed;
        z-index: 1;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .viewer-tools a,
      .viewer-tools span {
        padding: 11px 14px;
        color: #fff;
        background: rgba(0, 35, 65, 0.82);
        font-size: 14px;
        text-decoration: none;
      }

      .viewer-tools a:hover {
        background: #00579d;
      }

      @media (max-width: 600px) {
        .viewer-tools {
          top: 10px;
          left: 10px;
          right: 10px;
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="viewer-tools" aria-label="Controles da visita virtual">
      <a href="index.html#visita">Voltar ao Lab 4.0</a>
      <span>Arraste ou deslize para olhar ao redor</span>
    </nav>
    <a-scene
      embedded
      vr-mode-ui="enabled: true"
      renderer="colorManagement: true"
    >
      <a-assets>
        <img id="panorama-lab" src="panorama.jpeg" alt="" />
      </a-assets>
      <a-sky src="#panorama-lab" rotation="0 -90 0"></a-sky>
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
